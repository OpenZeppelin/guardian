profile_name = "devnet-bench-r4-7500"
guardian_endpoint = "http://server.guardian-bench.local:50051"
transport = "grpc"
duration_seconds = 480
warmup_seconds = 60
users = 15075
accounts_per_user = 1
deployment_shape = "devnet-bench-multi-task"
artifacts_dir = "benchmarks/prod-server/reports"

[operation_mix]
read_operation = "get_state"
reads_per_push = 0

[roles]
readers = 15000
writers = 75
reader_poll_interval_ms = 2000
read_mode = "nonce_then_state_on_change"
writer_push_interval_ms = 10000
cosigners_per_writer = 3

[scheme_distribution]
falcon_percent = 0
ecdsa_percent = 100

[canonicalization]
sample_rate = 0.0
poll_interval_ms = 1000
timeout_seconds = 60

[cleanup]
enabled = false

[aws]
profile = "terraform"
region = "us-east-1"
ecs_cluster = "guardian-cluster"
ecs_service = "guardian-bench"

[credential]
kind = "session"
network = "devnet"
