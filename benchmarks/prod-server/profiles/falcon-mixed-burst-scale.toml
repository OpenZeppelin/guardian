profile_name = "falcon-mixed-burst-scale"
guardian_endpoint = "https://guardian.openzeppelin.com"
transport = "grpc"
duration_seconds = 300
warmup_seconds = 0
users = 4096
accounts_per_user = 1
deployment_shape = "prod-single-task-arm64-rds-proxy"
artifacts_dir = "benchmarks/prod-server/reports"

[load_model]
model = "closed_loop"

[operation_mix]
mode = "mixed"
reads_per_push = 4
retire_after_first_successful_push = true

[scheme_distribution]
falcon_percent = 100
ecdsa_percent = 0

[canonicalization]
sample_rate = 0.05
poll_interval_ms = 1000
timeout_seconds = 180

[cleanup]
enabled = true

[aws]
profile = "dev"
region = "us-east-1"
ecs_cluster = "guardian-prod-cluster"
ecs_service = "guardian-prod-server"
