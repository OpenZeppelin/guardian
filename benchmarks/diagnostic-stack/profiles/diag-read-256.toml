# Diagnostic read profile — local stack, via the round-robin proxy.
#
# This tier never carries a target verdict (FR-017a). Its output is bottleneck
# attribution: client-side numbers from the harness, correlated against
# server-side Prometheus metrics that production does not expose.
#
# Load model is the existing closed-loop one: `users` here means requests
# permanently in flight, NOT the paced definition FR-003 resolved. Paced load
# lands in Phase 3; until then this profile measures saturation behaviour, which
# is the right shape for finding a bottleneck anyway.

profile_name = "diag-read-256"
guardian_endpoint = "http://127.0.0.1:50051"
transport = "grpc"
duration_seconds = 120
warmup_seconds = 20
users = 256
accounts_per_user = 1
deployment_shape = "local-diagnostic-2x-replica-postgres"
artifacts_dir = "benchmarks/diagnostic-stack/results"

[operation_mix]
read_operation = "get_state"
# The harness cannot express a read-only workload. `operation_for_index` emits a
# push every (reads_per_push + 1) operations, and reads_per_push = 0 means
# push-ONLY, not read-only. A very large value is the only way to get an
# effectively read-only run today; over a 120s leg no worker reaches the first
# push. The target's read dimension (20k readers issuing get_state) is genuinely
# read-only, so a first-class read-only mode is required before the authoritative
# read run — tracked in the plan, not worked around here.
reads_per_push = 1000000
retire_after_first_successful_push = false

[scheme_distribution]
falcon_percent = 0
ecdsa_percent = 100

[canonicalization]
sample_rate = 0.0         # reads only; nothing to sample
poll_interval_ms = 1000
timeout_seconds = 180

[cleanup]
# Local teardown is `docker compose down -v`, which drops the whole database.
# The ECS-exec purge path this flag enables is neither available nor needed here.
enabled = false

[aws]
# Placeholders. RunConfig::validate() requires these non-empty even for
# worker-run, which makes no AWS calls at all. Harmless, but it is why a local
# profile has to carry AWS fields it never uses.
region = "local"
ecs_cluster = "local"
ecs_service = "local"
