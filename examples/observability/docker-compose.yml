version: "3.8"

# Local Prometheus + Grafana stack that scrapes a guardian-server running
# with GUARDIAN_METRICS_ENABLED=true and visualizes it with a provisioned
# dashboard. The Guardian server itself is NOT part of this stack — run it
# separately (host `cargo run`, or the root docker-compose files) and this
# stack scrapes its metrics listener. See README.md.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Reach a guardian-server listening on the host (cargo run). On Docker
    # Desktop host.docker.internal resolves automatically; this mapping
    # makes it work on native Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      # Host 3001 to avoid clashing with guardian-server's HTTP port 3000.
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Zero-friction local viewing: open http://localhost:3001 and land
      # straight on the dashboard, no login. DEV ONLY — never enable
      # anonymous admin on a reachable Grafana.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
