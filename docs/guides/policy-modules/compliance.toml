# KYC and sanctions screening with the example compliance module
# (examples/compliance-module), run as a remote module next to the Guardian.
# Walkthrough: docs/guides/policy-modules/compliance.md.
# Copy to .guardian/compliance.toml. Both instances are served by one module process started
# with `--instance compliance ... --instance treasury-screening ...`.

# Every account: every signer KYC-verified, no payment to a sanctioned account.
# Clients learn only that a policy refused (client_reason = "generic"), not which rule, and
# cannot run it as a free dry-run check (dry_run = false), which would let a cosigner test
# addresses against the lists at no cost. It is not operator-disableable, but an operator with
# policies:write_global can still set its params to "off"; see the guide.
[[module]]
id = "compliance"
kind = "grpc"
endpoint = "grpc+insecure://127.0.0.1:7445"
scope = "all"
hooks = ["before_account_registered", "before_proposal_created", "before_transaction_approved"]
timeout_ms = 200
on_error = "deny"
client_reason = "generic"
dry_run = false
auth = { token_secret = "compliance.token" }
params = { signers = "all", recipients = "blocklist" }

# Opt-in, for accounts an operator assigns it to (treasuries): payments only to verified
# counterparties. It runs in addition to `compliance`, so it can only tighten. For an assigned
# instance the params below are only checked at startup: each account runs the params given
# when it is assigned, so assign it with { "signers": "off", "recipients": "allowlist" }.
[[module]]
id = "treasury-screening"
kind = "grpc"
endpoint = "grpc+insecure://127.0.0.1:7445"
scope = "assigned"
hooks = ["before_proposal_created", "before_transaction_approved"]
timeout_ms = 200
on_error = "deny"
client_reason = "generic"
operator_can_disable = true
auth = { token_secret = "treasury-screening.token" }
params = { signers = "off", recipients = "allowlist" }
