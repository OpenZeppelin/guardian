# Self-hosted, production-parity Guardian via Docker Compose with AWS-managed
# secret custody: Postgres for state, AWS Secrets Manager for the Falcon ACK key
# and the storage-encryption key, AWS KMS for the ECDSA ACK key (its private key
# never enters the process). A single server replica runs with GUARDIAN_ENV=prod,
# so every prod-stage guard is active (filesystem backend refused, cursor secret
# required, storage encryption validated at startup).
#
# Multi-replica HA is the ECS track — see ./README.md.
#
# Run from this directory:
#   cp .env.example .env        # then fill in the values
#   docker compose up
#
# Compose auto-loads .env from this directory. Walkthrough: ./README.md
# Full server config reference: ../../CONFIGURATION.md

services:
  server:
    image: ghcr.io/openzeppelin/guardian:${GUARDIAN_VERSION:-latest}
    pull_policy: always
    ports:
      - "3000:3000"
      - "50051:50051"
      - "9464:9464"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - guardian-keystore:/var/guardian/keystore
    env_file:
      - path: .env
        required: false
    environment:
      - RUST_LOG=info
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - DATABASE_URL=postgres://guardian:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/guardian
      - GUARDIAN_ENV=prod
      - AWS_REGION=${AWS_REGION:?set AWS_REGION in .env}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - GUARDIAN_ACK_FALCON_SECRET_ID=${GUARDIAN_ACK_FALCON_SECRET_ID:?set GUARDIAN_ACK_FALCON_SECRET_ID in .env}
      - GUARDIAN_ACK_ECDSA_BACKEND=aws-kms
      - GUARDIAN_ACK_ECDSA_KMS_KEY_ID=${GUARDIAN_ACK_ECDSA_KMS_KEY_ID:?set GUARDIAN_ACK_ECDSA_KMS_KEY_ID in .env}
      - GUARDIAN_STORAGE_ENCRYPTION_KEY_SECRET_ID=${GUARDIAN_STORAGE_ENCRYPTION_KEY_SECRET_ID:?set GUARDIAN_STORAGE_ENCRYPTION_KEY_SECRET_ID in .env}
      - GUARDIAN_DASHBOARD_CURSOR_SECRET=${GUARDIAN_DASHBOARD_CURSOR_SECRET:?set GUARDIAN_DASHBOARD_CURSOR_SECRET in .env}
      - GUARDIAN_NETWORK_TYPE=${GUARDIAN_NETWORK_TYPE:-MidenTestnet}
      - GUARDIAN_CORS_ALLOWED_ORIGINS=${GUARDIAN_CORS_ALLOWED_ORIGINS:-}
      - GUARDIAN_OPERATOR_PUBLIC_KEYS_SECRET_ID=${GUARDIAN_OPERATOR_PUBLIC_KEYS_SECRET_ID:-}
      - GUARDIAN_METRICS_ENABLED=${GUARDIAN_METRICS_ENABLED:-false}
      - GUARDIAN_METRICS_ADDR=0.0.0.0:9464
      - GUARDIAN_METRICS_BEARER_TOKEN=${GUARDIAN_METRICS_BEARER_TOKEN:-}

  postgres:
    image: postgres:16-alpine
    volumes:
      - guardian-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=guardian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guardian-keystore:
  guardian-postgres:
