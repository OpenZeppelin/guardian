# The config-writing procedures encode the signature scheme into the advice
# payload they build, and two scheme-binding defects have already been found
# here (F8, F13). Running membership changes on one scheme only would leave an
# ECDSA-specific defect in that encoding undetected, so these two mirror the
# Falcon pair above rather than relying on it.
[[scenario]]
id = "live-add-signer-2of3-ecdsa"
title = "A signer is admitted on an ECDSA account and the account reports the larger set"
profile = "live"
sdk = "both"
runtime = "server-side"
