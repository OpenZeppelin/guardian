# The other half of rotation. The offline scenario below is the air-gapped
# path, where nothing reaches GUARDIAN until a signed document is imported.
# This is the path a reachable deployment actually uses: GUARDIAN coordinates
# the proposal, cosigners sign it there, and only then does it execute.
# Rotation is a first-class custody operation, so qualifying one path and not
# the other left the common one untested.
#
# 2-of-3 on purpose: coordinating cosigner signatures through the pending set
# is the thing that distinguishes this from the offline path, and a 1-of-1
# never exercises it. Falcon on purpose too: the offline rotation runs on
# ECDSA, so the pair covers both schemes for a flow whose scheme is encoded in
# the advice payload.
[[scenario]]
id = "live-guardian-switch-online-2of3-falcon"
title = "GUARDIAN rotation proposed, cosigned and executed through the pending set"
profile = "live"
sdk = "both"
runtime = "server-side"
scheme = "falcon"
shape = "2-of-3"
mode = "online"
actions = ["account-create", "account-register", "asset-transfer", "note-consume", "guardian-switch-online", "proposal-sign", "proposal-execute", "guardian-switch-assert"]
step_budget = "600s"
required = true
core = false

[[scenario]]
id = "live-guardian-migrate-offline-1of1-ecdsa"
title = "Guardian migration created offline, signed, imported and executed"
profile = "live"
sdk = "both"
runtime = "server-side"
scheme = "ecdsa"
shape = "1-of-1"
mode = "offline"
# `guardian-switch-assert` last, and it is not decoration: completion for a
# migration cannot ask for a canonical delta, because the canonical delta stays
# with the GUARDIAN being left behind, so the completion check falls back to
# chain agreement. An execution that regressed to a no-op satisfies that, since
# an account that never moved still agrees with chain. Only reading the
# account's binding back and comparing it with the target's own commitment
# separates a rotation from a no-op.
actions = ["account-create", "account-register", "asset-transfer", "note-consume", "proposal-create-offline", "guardian-migrate", "proposal-sign-external", "proposal-import", "proposal-execute", "guardian-switch-assert"]
step_budget = "300s"
required = true
core = false

