# The ECDSA half of off-channel signing. The exported document carries the
# collected signatures, and both parsing them back
# (`SignatureScheme::parse_signature_hex`) and building the advice entry from
# them (`build_signature_advice_entry`) dispatch on the scheme, so Falcon and
# ECDSA take different code through the part of the flow this scenario exists
# to cover. That path also changed recently, when Rust stopped tying offline
# signing to offline execution, so it is newly exercised rather than settled.
