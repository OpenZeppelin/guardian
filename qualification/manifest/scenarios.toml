# The account-wide threshold and a per-procedure override live in different
# storage slots, so changing one should leave the other alone. That was an
# assumption until this ran: the two were only ever exercised apart, and a
# wiped override silently lowers the quorum on a procedure someone deliberately
# raised.
[[scenario]]
id = "live-procedure-threshold-survives-change-2of3-falcon"
title = "A procedure override outlives a change to the account-wide threshold"
profile = "live"
sdk = "both"
runtime = "server-side"
scheme = "falcon"
shape = "2-of-3"
mode = "online"
actions = ["account-create", "account-register", "asset-transfer", "note-consume", "procedure-threshold-set", "proposal-sign", "proposal-execute", "threshold-change", "proposal-sign", "proposal-execute", "procedure-threshold-assert"]
step_budget = "720s"
required = true
core = false

