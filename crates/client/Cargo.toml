[package]
name = "guardian-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Client library for Guardian"
include = ["src/**/*", "proto/**/*", "build.rs", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
guardian-shared = { version = "=0.17.0-rc.2", path = "../shared" }
miden-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
thiserror = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
tokio-stream = { version = "0.1", optional = true }

[features]
# In-process mock GUARDIAN gRPC server (`testing::mocks`) for downstream
# crates' test suites; always available to this crate's own tests.
testing = ["dep:tokio-stream", "tokio-stream/net", "tokio/net"]

[dev-dependencies]
miden-rpc-client = { path = "../miden-rpc-client" }
miden-keystore = { path = "../miden-keystore" }
miden-standards = { workspace = true }
rand_chacha = { workspace = true }
tempfile = { workspace = true }
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = { workspace = true }
