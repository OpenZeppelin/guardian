[package]
name = "miden-confidential-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Builder facade for Miden guarded-multisig accounts (upstream miden-standards component)"

[dependencies]
miden-standards = { workspace = true }
miden-protocol = { workspace = true }

anyhow = { workspace = true }
guardian-shared = { version = "=0.15.1", path = "../shared" }

[features]
testing = ["miden-protocol/testing"]

[dev-dependencies]
miden-confidential-contracts = { path = ".", features = ["testing"] }
miden-client = { workspace = true, features = ["testing", "tonic"] }
miden-tx = { workspace = true }
miden-testing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
assert_matches = { workspace = true }
