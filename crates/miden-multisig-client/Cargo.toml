[package]
name = "miden-multisig-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-level SDK for interacting with multisig accounts on Miden via GUARDIAN"

[dependencies]
# Internal crates
guardian-client = { version = "=0.17.0-rc.3", path = "../client" }
guardian-shared = { version = "=0.17.0-rc.3", path = "../shared" }
miden-confidential-contracts = { version = "=0.17.0-rc.3", path = "../contracts" }

# Miden
miden-client = { workspace = true, features = ["tonic"] }
miden-client-sqlite-store = { workspace = true }
miden-protocol = { workspace = true }
miden-tx = { workspace = true }
miden-standards = { workspace = true }

# Async
async-trait = "0.1"
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging (facade only; host applications install the subscriber)
tracing = "0.1"
anyhow = { workspace = true }

# Utilities
rand = { workspace = true }
tonic = { workspace = true }
url = "2.5"

[features]
default = ["legacy-consume-notes"]
# Accept v1 `consume_notes` metadata (no `metadata_version`). The
# cut-over release will ship with `default = []`. Tracks issue #229.
legacy-consume-notes = []

[dev-dependencies]
guardian-client = { version = "=0.17.0-rc.2", path = "../client", features = ["testing"] }
tempfile = { workspace = true }
miden-confidential-contracts = { version = "=0.17.0-rc.3", path = "../contracts", features = ["testing"] }
miden-client = { workspace = true, features = ["tonic", "testing"] }
miden-rpc-client = { path = "../miden-rpc-client", features = ["scripted-node"] }
