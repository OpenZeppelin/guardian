[workspace]
members = [
    "benchmarks/prod-server",
    "crates/shared",
    "crates/client",
    "crates/server",
    "crates/server/bench/loadgen",
    "crates/miden-rpc-client",
    "crates/miden-keystore",
    "crates/contracts",
    "crates/miden-multisig-client",
    "crates/qualification-driver",
    "examples/rust",
    "examples/demo",
]
default-members = [
    "crates/shared",
    "crates/client",
    "crates/server",
    "crates/miden-rpc-client",
    "crates/miden-keystore",
    "crates/contracts",
    "crates/miden-multisig-client",
]
resolver = "2"

[workspace.package]
version = "0.19.1"
edition = "2024"
rust-version = "1.99.1"
authors = ["OpenZeppelin"]
license = "AGPL-3.0"
repository = "https://github.com/OpenZeppelin/guardian"
homepage = "https://github.com/OpenZeppelin/guardian"

# Reproducible build configuration (workspace-wide)
[profile.release]
strip = true           # Strip debug symbols for smaller, more reproducible binaries
lto = true            # Link-time optimization for better optimization and determinism
codegen-units = 1     # Single codegen unit for maximum reproducibility
incremental = false   # Disable incremental compilation for reproducibility

# Dependencies — the crypto crates especially (Falcon, RPO, Merkle) — are an
# order of magnitude slower at opt-level 0, which dominated test wall-clock
# (the CI Test Suite spent ~14 of its 20 minutes executing tests). Build
# dependencies optimized in dev/test/coverage builds; workspace crates keep
# opt-level 0 for fast rebuilds, debugging, and coverage. Dependencies
# compile once and stay cached, so the extra compile cost is paid rarely.
[profile.dev.package."*"]
opt-level = 3
# No debuginfo for dependencies: nobody steps into them, and dep debuginfo at
# opt-level 3 is the bulk of target-dir size — which matters because CI's
# per-repo cache quota is 10GB across all jobs' target caches.
debug = false

[workspace.dependencies]
# Core
serde = "1.0.228"
serde_json = "1.0.145"
tokio = "1.47.1"
tonic = "0.14.2"
prost = "0.14.1"
tonic-build = "0.14.1"
tonic-prost-build = "0.14.2"
tonic-prost = "0.14.2"
thiserror = "2.0.9"
hex = "0.4.3"
base64 = "0.22"
rand_chacha = "0.10"
tempfile = "3.15.0"
rand = "0.10"
anyhow = { version = "1.0", features = ["backtrace", "std"] }
assert_matches = "1.5"
rstest = "0.26"
futures = "0.3"
chrono = "0.4"
# OpenAPI spec generation (issue #241). `axum_extras` enables richer
# parameter inference for axum `Query`/`Path` extractors.
utoipa = { version = "5", features = ["axum_extras"] }

# Miden pins: exact only. The Rust workspace is on the 0.18 line; the
# TypeScript SDK stays on @miden-sdk/miden-sdk 0.17.8 until a 0.18 web SDK
# ships. The two lines share account code, procedure roots and multisig auth
# args, which the determinism vectors and the browser parity gate check. A
# pin on either side that changes them makes the two clients compute
# different transaction summary commitments and auth procedure roots.
miden-protocol = { git = "https://github.com/0xMiden/protocol", rev = "0a5cbc49dd5e61782e779da4741b74ebe24ab108" }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "0a5cbc49dd5e61782e779da4741b74ebe24ab108" }
miden-tx = { git = "https://github.com/0xMiden/protocol", rev = "0a5cbc49dd5e61782e779da4741b74ebe24ab108" }
miden-tx-batch = { git = "https://github.com/0xMiden/protocol", rev = "0a5cbc49dd5e61782e779da4741b74ebe24ab108" }
miden-node-proto-build = { git = "https://github.com/0xMiden/node", rev = "629ddf23acd8b21ca48911d0ad7293b31b03f95d", default-features = false }
miden-testing = { git = "https://github.com/0xMiden/protocol", rev = "0a5cbc49dd5e61782e779da4741b74ebe24ab108" }
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "ca8f4d7a205edc4aae604b0a061b707c25115670" }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/rust-sdk", rev = "ca8f4d7a205edc4aae604b0a061b707c25115670" }
miden-client-proto = { git = "https://github.com/0xMiden/rust-sdk", rev = "ca8f4d7a205edc4aae604b0a061b707c25115670" }
miden-processor = "=1.0.0-rc.1"
