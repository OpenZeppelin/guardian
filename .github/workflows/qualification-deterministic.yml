---
name: Qualification (deterministic)

# Dispatch-only for now. The required deterministic scenarios are implemented and
# pass, including on macOS since F12 was fixed, and an action without a driver
# implementation fails closed on a required scenario so a gap can never read as
# a pass. What is left before this becomes a required check is that it has not
# run on a Linux runner, and the rule below. The trigger block is the one to
# restore, unchanged, once a dispatched run has been seen green here:
#
#   push:
#     branches: [main]
#     paths-ignore: ["**/*.md", "docs/**", "spec/**", "speckit/**", "audits/**"]
#   pull_request:
#     branches: [main]
#     paths-ignore: ["**/*.md", "docs/**", "spec/**", "speckit/**", "audits/**"]
#
# Only make it a required check after it has been seen to go red on a real
# regression. A gate that has never failed is not known to be a gate.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Published image to qualify instead of building, e.g. v1.2.3 (leave blank to build the checked-out ref)"
        type: string
        required: false
      upgrade-from:
        description: "Published tag to seed the database from before upgrading to the image under test, e.g. v1.2.3 (leave blank to skip the upgrade pass)"
        type: string
        required: false

concurrency:
  group: qualification-deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  deterministic:
    name: Deterministic Profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Deep enough to diff a pull request against its base, which is how
          # the upgrade pass decides whether this change touches migrations.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      # The stack script drives the TypeScript leg through `test:qualification`,
      # which needs the workspace installed and both clients built. Their
      # `dist/` is gitignored, and the qualification runner imports the operator
      # client at module scope through `actions/operator.ts`, so a missing build
      # is a package-resolution failure before any scenario runs, on either
      # profile rather than only the operator ones.
      - name: Install workspace dependencies
        working-directory: packages
        run: npm ci

      - name: Build the GUARDIAN clients
        working-directory: packages
        run: |
          npm run build -w @openzeppelin/guardian-client
          npm run build -w @openzeppelin/guardian-operator-client

      # Seeding a database with an older release and re-running against it costs
      # a second pass, so it is spent where it can pay: on a change that touches
      # migrations. A migration that cannot boot on the current release's data
      # is the defect this catches, and the two irreversible resets recorded in
      # docs/MIDEN_COMPATIBILITY.md are the precedent for taking it seriously.
      #
      # Inert on a dispatch without the input, because there is no base to diff
      # against. It starts deciding for itself when the pull_request trigger in
      # the header is restored.
      - name: Decide whether to qualify an upgrade
        id: upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.upgrade-from }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${REQUESTED}" ]]; then
            echo "tag=${REQUESTED}" >> "$GITHUB_OUTPUT"
            echo "::notice::Qualifying an upgrade from ${REQUESTED} (requested)."
            exit 0
          fi
          if [[ -z "${BASE_SHA}" ]]; then
            exit 0
          fi
          if git diff --quiet "${BASE_SHA}...HEAD" -- crates/server/migrations/; then
            echo "No migration changes; skipping the upgrade pass."
            exit 0
          fi
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -z "${latest}" ]]; then
            echo "::warning::This change touches migrations but no published release was found to seed from."
            exit 0
          fi
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "::notice::This change touches migrations; qualifying an upgrade from ${latest}."

      - name: Validate the scenario manifest
        run: >-
          cargo run --quiet -p guardian-qualification-driver --
          validate

      - name: Run the deterministic profile
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          UPGRADE_FROM: ${{ steps.upgrade.outputs.tag }}
        run: |
          args=(--profile deterministic --trigger dispatch)
          args+=(--out "${GITHUB_WORKSPACE}/qualification-results")
          if [[ -n "${IMAGE_TAG}" ]]; then
            args+=(--image-source pulled --image-tag "ghcr.io/openzeppelin/guardian:${IMAGE_TAG}")
          fi
          # The upgrade question, asked without a treasury: the deterministic
          # scenarios seed the database through the product's own API, then the
          # image under test boots on those rows and re-runs against them. Which
          # tag to seed from is a release decision rather than a test one, so it
          # is an input rather than a default.
          if [[ -n "${UPGRADE_FROM}" ]]; then
            args+=(--upgrade-from "ghcr.io/openzeppelin/guardian:${UPGRADE_FROM}")
          fi
          qualification/stack/run.sh "${args[@]}"

      - name: Confirm the secret scan passed
        if: always()
        id: scan
        run: |
          if [[ -f qualification-results/.scan-passed ]]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Artifacts are not being uploaded because the secret scan did not pass."
          fi

      - name: Upload results and diagnostics
        if: always() && steps.scan.outputs.clean == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qualification-deterministic-${{ github.run_id }}
          path: qualification-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deterministic qualification"
            echo
            echo "Status: ${JOB_STATUS}"
            echo
            if [[ -d qualification-results ]]; then
              for file in qualification-results/*.json; do
                [[ -e "${file}" ]] || continue
                echo "- \`$(basename "${file}")\`"
              done
            fi
            echo
            echo "A green run does not imply full coverage; read \`qualification_claim\` in the result."
          } >> "$GITHUB_STEP_SUMMARY"
