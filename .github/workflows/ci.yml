---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4a44d353abec8bd780e47de38e5bc5ea77053391 # cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --lib --workspace --lcov --output-path lcov.info

      - name: Run feature-006 authz-test-probe tests
        # The `authz-test-probe` Cargo feature (default-off in release builds —
        # see `crates/server/src/dashboard/probe.rs`) gates a test-only
        # route that exercises the operator-authorization middleware
        # end-to-end. Run guardian-server's lib tests with the feature
        # enabled so the US2 probe integration tests execute in CI.
        run: cargo test -p guardian-server --lib --features authz-test-probe

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  contract-behavior:
    # MockChain behavior suite for the upstream guarded-multisig component
    # (crates/contracts/tests/) plus the multisig client's integration tests.
    # These live in tests/ directories, which the coverage job's `--lib` run
    # never executes — without this job the contract authentication paths
    # (update signers, per-procedure thresholds, guardian rotation, replay
    # protection) have no CI coverage at all.
    name: Contract Behavior Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run contract behavior and SDK integration tests
        run: cargo test -p miden-confidential-contracts -p miden-multisig-client --all-targets

  server-e2e:
    # Server end-to-end suite behind the `e2e` Cargo feature
    # (crates/server/src/testing/e2e/, gated by `#![cfg(feature = "e2e")]`).
    # The coverage job's `--lib` run never enables the feature, so without this
    # job these paths do not compile in CI, let alone run — including the
    # guardian-rotation reconstruction parity gate
    # (`switch_guardian_canonicalization`), which asserts the server's
    # reconstruction of a pushed switch delta canonicalizes against the
    # commitment a real signed execution produced. That divergence was issue
    # #303/#305 in production.
    name: Server E2E Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-e2e-

      - name: Run server e2e tests
        run: cargo test -p guardian-server --features e2e --lib 'testing::e2e::'

  ts-sdk:
    # Cross-SDK parity gates for the TypeScript multisig client. The vitest
    # suite pins PROCEDURE_ROOTS against the Rust `procedure_roots` example
    # output and the vendored MASM against its generated constant; the
    # Playwright run is the byte-for-byte account-determinism gate (TS-built
    # account id/commitment == Rust builder). A miden-standards or
    # @miden-sdk/miden-sdk bump that shifts procedure roots or storage layout
    # fails here instead of stranding deployed accounts silently.
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ts-

      # The vitest parity test shells out to this example; prebuilding keeps
      # the test itself fast and its failure modes distinct from build errors.
      - name: Prebuild procedure_roots example
        run: cargo build --example procedure_roots -p miden-multisig-client

      # miden-multisig-client consumes guardian-client via a `file:` link, so
      # its `dist` (gitignored) must be built before the linked install below
      # can resolve the client's types and runtime.
      - name: Build linked guardian-client
        working-directory: packages/guardian-client
        run: npm ci && npm run build

      # The runner's preinstalled Node (>= 18, per the package engines field)
      # is used directly to avoid adding an unpinned action.
      - name: Install package dependencies
        working-directory: packages/miden-multisig-client
        run: npm ci

      - name: Run vitest parity and unit tests
        working-directory: packages/miden-multisig-client
        run: npm test

      - name: Build package
        working-directory: packages/miden-multisig-client
        run: npm run build

      # channel 'chrome' in playwright.config.ts uses the runner's system
      # Chrome; no browser download required.
      - name: Run browser determinism gate
        working-directory: packages/miden-multisig-client
        run: npm run test:browser

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Build (generate protobuf descriptors)
        run: cargo build --package guardian-server

      - name: Check shared crate with production features
        run: cargo check --package guardian-shared --lib

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --release --all-features

  openapi:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.96.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-openapi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openapi-

      # Fails if the committed docs/openapi*.json files are out of sync
      # with the utoipa annotations. Regenerate with:
      #   cargo run --features evm --bin gen-openapi -- docs
      - name: Check OpenAPI spec is up to date
        run: cargo run --features evm --bin gen-openapi -- --check docs
