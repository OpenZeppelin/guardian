---
# Attaches the custom-guardian template to a release: examples/custom-guardian as a standalone
# project that depends on the Guardian crates at the release tag and carries the release's
# Cargo.lock (RFC 0002, section 2.5). The template's Docker image is built with --locked before
# the archive is uploaded, so a template that does not build is never published.

name: Custom Guardian Template

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the template for, e.g. v0.19.0"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: custom-guardian-template-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  template:
    name: Build and attach the template
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::${TAG} is not a release tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          }
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null

      - name: Check out the release
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.1

      - name: Build the template
        run: scripts/custom-guardian-template.sh --tag "${TAG}" --out "${RUNNER_TEMP}/custom-guardian"

      - name: Build the template image
        working-directory: ${{ runner.temp }}/custom-guardian
        run: docker build -t custom-guardian-template-check .

      - name: Attach the template to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${RUNNER_TEMP}/custom-guardian-${TAG}.tar.gz"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" custom-guardian
          gh release upload "${TAG}" "${archive}" --clobber --repo "${GITHUB_REPOSITORY}"
