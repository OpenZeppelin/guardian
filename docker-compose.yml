version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GUARDIAN_SERVER_FEATURES: ""
    ports:
      - "3000:3000"
      - "50051:50051"
    volumes:
      - guardian-storage:/var/guardian/storage
      - guardian-metadata:/var/guardian/metadata
      - guardian-keystore:/var/guardian/keystore
    env_file:
      - path: .env
        required: false
    environment:
      - RUST_LOG=info
      - GUARDIAN_STORAGE_PATH=/var/guardian/storage
      - GUARDIAN_METADATA_PATH=/var/guardian/metadata
      - GUARDIAN_KEYSTORE_PATH=/var/guardian/keystore
      - GUARDIAN_NETWORK_TYPE
      # Every caller from the host shares one rate-limit bucket (the limiter
      # keys by IP and sees the bridge gateway), so the unconfigured defaults
      # of 10/sec and 60/min are tight locally. Override in .env.
      - GUARDIAN_RATE_BURST_PER_SEC=${GUARDIAN_RATE_BURST_PER_SEC:-200}
      - GUARDIAN_RATE_PER_MIN=${GUARDIAN_RATE_PER_MIN:-5000}
      # Optional Miden RPC overrides; pass through from the host environment.
      - GUARDIAN_MIDEN_RPC_ENDPOINT
      - GUARDIAN_MIDEN_RPC_TIMEOUT_MS
      - GUARDIAN_MIDEN_RPC_MAX_ATTEMPTS

volumes:
  guardian-storage:
  guardian-metadata:
  guardian-keystore:
