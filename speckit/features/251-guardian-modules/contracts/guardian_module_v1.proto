// guardian.module.v1, extracted from docs/rfcs/0002-guardian-modules.md section 3 (revision 24).
// The proto in RFC section 3 is authoritative; regenerate this file when it changes.
// Protocol version 1 is frozen when M2a ships.

syntax = "proto3";
package guardian.module.v1;

import "google/protobuf/timestamp.proto";

service GuardianModule {
  rpc Describe(DescribeRequest) returns (ModuleInfo);
  rpc ValidateParams(ValidateParamsRequest) returns (ParamsVerdict);
  rpc Evaluate(HookRequest) returns (Decision);
  rpc Notify(CommitEvent) returns (NotifyAck);
  rpc NotifyGap(Gap) returns (NotifyAck);
}

enum Hook {
  HOOK_UNSPECIFIED = 0;
  HOOK_BEFORE_TRANSACTION_APPROVED = 1;
  HOOK_BEFORE_ACCOUNT_REGISTERED = 2;
  HOOK_AFTER_TRANSACTION_COMMITTED = 3;
  HOOK_BEFORE_PROPOSAL_CREATED = 4;
}

message DescribeRequest {
  uint32 guardian_protocol_version = 1;      // the newest protocol version the Guardian speaks
  uint32 guardian_min_protocol_version = 2;  // the oldest it still accepts (section 3.5)
  repeated string guardian_capabilities = 3; // optional features this Guardian provides (section 3.5)
}
message ModuleInfo {
  string name = 1;
  string version = 2;
  uint32 protocol_version = 3;               // must lie in the Guardian's supported range
  repeated Hook hooks = 4;
  repeated string required_capabilities = 5; // startup fails if the Guardian lacks one
}
message ValidateParamsRequest {
  string instance_id = 1;
  bytes params = 2;                          // UTF-8 JSON
}
message ParamsVerdict {
  bool ok = 1;
  string message = 2;
  bytes normalized_params = 3;               // UTF-8 JSON; empty: store the params as sent (section 3.5)
}
message NotifyAck {}

message HookRequest {
  string request_id = 1;              // one per hook invocation, shared by every module and layer called in it (section 3.1)
  Hook hook = 2;
  bool dry_run = 3;                   // a policy check: nothing is stored or signed whatever the decision (section 2.7)
  string network = 4;                 // network family: "miden"
  string network_id = 5;              // the account's network within the family: "mainnet", "testnet", "devnet", "cedar" or "local" (section 3.1)
  string account_id = 6;
  string instance_id = 7;             // catalog id of the instance being called
  bytes params = 8;                   // UTF-8 JSON, params of the layer being evaluated (global, account layer, or the account's own for default/assigned)
  google.protobuf.Timestamp accounting_time = 9;  // recorded as signed_at if this transaction is signed (section 3.4); at before_proposal_created and in a dry run, the evaluation time, never recorded
  string submitter = 10;              // signer commitment that authenticated this request; verified (section 3.2)
  bool submitter_session = 11;        // the request was authenticated by a session key the submitter delegated (section 3.2)
  optional AccountView before = 12;   // the account as the Guardian holds it; absent for a first configuration (section 3.2)
  AccountView after = 13;             // the account as it will be if every module allows (section 3.2)
  oneof subject {                     // hook-specific detail only
    TransactionSubject transaction = 14;
    RegistrationSubject registration = 15;
  }
}

message AccountView {
  string commitment = 1;
  string auth_scheme = 2;             // "falcon" or "ecdsa", from the registered auth configuration (section 3.2)
  repeated string signer_commitments = 3;
  optional uint32 default_threshold = 4;  // absent for single-key accounts
  map<string, uint32> procedure_thresholds = 5;  // procedure root -> threshold; only overrides the account's code can apply (section 3.2)
  string code_commitment = 6;         // commitment of the account's code
  repeated string procedure_roots = 7;  // roots of the procedures the account's code exports
}

message TransactionSubject {
  TransactionProjection projection = 1;  // the contract modules should rely on, per network
  RawTransaction raw = 2;             // the network's own encoding; UNSTABLE across that network's protocol bumps
  repeated PendingTransaction pending = 3;  // signed for this account, not yet acknowledged by this module (section 3.4)
  string proposer = 4;                // signer commitment that created the matching proposal; verified; empty when there is none (section 3.2)
  bool proposer_session = 5;          // the proposer created it through a delegated session key (section 3.2)
  bytes unverified_metadata = 6;      // UTF-8 JSON, proposer-asserted proposal metadata; never authoritative; UNSTABLE across SDK releases (section 3.2)
}

message PendingTransaction {
  string new_commitment = 1;          // = event_id once committed
  TransactionProjection projection = 2;
  google.protobuf.Timestamp signed_at = 3;      // the accounting clock (section 3.4)
  PendingState state = 4;
  uint64 nonce = 5;                   // account nonce after this transaction; compared with the module's watermark
  optional google.protobuf.Timestamp committed_at = 6;  // set when state = committed
  string submitter = 7;               // as in HookRequest at the ack that signed this transaction; verified (section 3.2)
  string proposer = 8;                // as in TransactionSubject at that ack; empty when there was no matching proposal
  bool proposer_session = 9;          // as in TransactionSubject at that ack
}
enum PendingState {
  PENDING_STATE_UNSPECIFIED = 0;
  PENDING_STATE_CANDIDATE = 1;        // signed, waiting to become committed
  PENDING_STATE_COMMITTED = 2;        // committed, notify not yet acknowledged by this module
}

message RegistrationSubject {
  AccountStateProjection initial_state = 1;  // the account about to be accepted, per network
}

enum Effect {
  EFFECT_UNSPECIFIED = 0;             // a module that does not set `effect`: `allow` decides
  EFFECT_ALLOW = 1;
  EFFECT_DENY = 2;
}

message Decision {
  bool allow = 1;                     // read only when effect is unspecified
  string reason_code = 2;             // required on a deny; ignored on an allow
  string message = 3;                 // logged, never forwarded to clients
  Effect effect = 4;                  // wins over allow when set; a value the Guardian does not know is a module failure
  string client_message = 5;          // optional, plain text, at most 256 characters; forwarded only where the instance allows it (section 2.7)
}

// A transaction as its network describes it. One variant per network; a module reads the
// variant for the networks it supports.
message TransactionProjection {
  oneof network {
    MidenTransaction miden = 1;
  }
}

// An account's state as its network describes it.
message AccountStateProjection {
  oneof network {
    MidenAccountState miden = 1;
  }
}

// A transaction in its network's own serialization, for modules that decode it themselves.
message RawTransaction {
  string encoding = 1;                // names the format and its version line, for example "miden.transaction_summary"
  bytes data = 2;
}

message MidenTransaction {
  int64 nonce_delta = 1;
  uint32 reference_block = 2;         // the block the transaction was executed against
  optional uint32 expiration_block = 3;  // absent when the transaction sets no expiration (section 3.1)
  repeated VaultChange vault_changes = 4;
  repeated OutputNote output_notes = 5;
  repeated InputNote input_notes = 6;
  repeated StorageChange storage_changes = 7;
  optional string new_code_commitment = 8;  // set when the transaction replaces the account's code (section 3.1)
}

message MidenAccountState {
  repeated Asset vault = 1;
  repeated StorageSlot storage = 2;
}

message Asset {
  string faucet_id = 1;
  oneof value { string fungible_amount = 2; string nft_id = 3; }  // amounts as decimal strings
}

message VaultChange { Asset asset = 1; Direction direction = 2; }
enum Direction { DIRECTION_UNSPECIFIED = 0; DIRECTION_IN = 1; DIRECTION_OUT = 2; }

message OutputNote {
  string note_id = 1;
  NoteType note_type = 2;
  bool partial = 3;                   // only the recipient digest is known
  string recipient_digest = 4;
  repeated Asset assets = 5;
  string script_root = 6;
  optional string p2id_target = 7;    // set only for known P2ID / P2IDE scripts
  bool tx_fee = 8;                    // the fee note pay_fee creates; not a payment
}
enum NoteType { NOTE_TYPE_UNSPECIFIED = 0; NOTE_TYPE_PUBLIC = 1; NOTE_TYPE_PRIVATE = 2; }

message InputNote { string note_id = 1; repeated Asset assets = 2; }

message StorageChange {
  string slot_name = 1;               // StorageSlotName, e.g. "miden::standards::auth::multisig::threshold_config"
  StorageSlotKind kind = 2;
  StorageOp op = 3;
  string value = 4;                   // kind = value, op = create or update: the new value
  MapChanges map = 5;                 // kind = map, op = create: initial entries; op = update: changed entries
}
enum StorageSlotKind { STORAGE_SLOT_KIND_UNSPECIFIED = 0; STORAGE_SLOT_KIND_VALUE = 1; STORAGE_SLOT_KIND_MAP = 2; }
enum StorageOp { STORAGE_OP_UNSPECIFIED = 0; STORAGE_OP_CREATE = 1; STORAGE_OP_UPDATE = 2; STORAGE_OP_REMOVE = 3; }
message MapChanges { repeated MapEntry entries = 1; }
message MapEntry { string key = 1; string value = 2; }  // value = empty word: the entry was removed
message StorageSlot {
  string slot_name = 1;
  StorageSlotKind kind = 2;
  oneof content { string value = 3; MapChanges map = 4; }
}

message CommitEvent {
  string event_id = 1;                // = new_commitment; stable across redelivery
  string instance_id = 2;
  string account_id = 3;
  string network = 4;                 // as in HookRequest
  string network_id = 5;              // as in HookRequest
  string prev_commitment = 6;
  string new_commitment = 7;
  uint64 nonce = 8;                   // account nonce after this transaction; the delivery watermark (section 3.3)
  TransactionProjection projection = 9;
  google.protobuf.Timestamp committed_at = 10;
  google.protobuf.Timestamp signed_at = 11;  // the accounting clock, identical to the value the module saw in pending (section 3.4)
  string submitter = 12;              // as in HookRequest at the ack that signed this transaction; verified (section 3.2)
  string proposer = 13;               // as in TransactionSubject at that ack; empty when there was no matching proposal (section 3.2)
  bool proposer_session = 14;         // as in TransactionSubject at that ack
}

message Gap {
  string instance_id = 1;
  string account_id = 2;
  string network = 3;                 // as in HookRequest
  string network_id = 4;              // as in HookRequest
  google.protobuf.Timestamp dropped_before = 5;  // restart position: events for the account committed before this and not acknowledged may be missing
  uint64 resume_from_nonce = 6;       // first nonce delivered after the gap; the module's watermark becomes resume_from_nonce - 1 (section 3.3)
}
